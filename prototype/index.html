<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#10151b"><title>Drift Evolution — Physics Lab</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#10151b;color:#f4f6f8;font-family:system-ui,Arial;overflow:hidden}.top{height:58px;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;background:#171f28;border-bottom:1px solid #2c3945}.brand{font-weight:900;letter-spacing:1px}.brand span{color:#ff7b24}.stats{display:flex;gap:12px;font-size:12px;color:#b8c3ce}.stats b{color:white;font-size:15px}canvas{display:block;width:100vw;height:calc(100dvh - 145px);touch-action:none;background:#202b2d}.bottom{height:87px;display:flex;align-items:center;justify-content:space-around;background:#171f28;border-top:1px solid #34414c;gap:8px;padding:8px}.pad{display:flex;gap:8px}.key{width:58px;height:58px;border:1px solid #52616e;border-radius:14px;background:#26333e;color:white;font-size:22px;font-weight:bold;touch-action:none}.key:active,.key.on{background:#ff7b24;border-color:#ff7b24}.gas{background:#63351e;border-color:#ff7b24}.hint{position:absolute;top:70px;left:10px;background:#101820cc;padding:8px 10px;border-radius:9px;font-size:11px;color:#d6e0e8;pointer-events:none}.start{position:absolute;inset:58px 0 87px;display:grid;place-items:center;background:#0d141bcc}.panel{background:#1b2630;border:1px solid #45515d;padding:22px;border-radius:18px;text-align:center;width:min(88%,360px)}.panel h1{margin:0 0 8px}.panel p{color:#b8c3ce;font-size:13px;line-height:1.7}.panel button{background:#ff7b24;color:#111;border:0;border-radius:10px;padding:13px 28px;font-weight:900;font-size:16px}
</style></head><body><header class="top"><div class="brand">DRIFT <span>EVOLUTION</span></div><div class="stats"><div>السرعة<br><b id="speed">0</b> km/h</div><div>النقاط<br><b id="score">0</b></div><div>الانجراف<br><b id="angle">0°</b></div></div></header>
<canvas id="game"></canvas><div class="hint">WASD / الأسهم للقيادة · Space هاندبريك · R إعادة</div>
<div class="bottom"><div class="pad"><button class="key" data-k="left">◀</button><button class="key" data-k="right">▶</button></div><div class="pad"><button class="key" data-k="brake">▼</button><button class="key gas" data-k="gas">▲</button><button class="key" data-k="hand">H</button></div></div>
<div class="start" id="start"><div class="panel"><h1>DRIFT <span style="color:#ff7b24">EVOLUTION</span></h1><p>مختبر قيادة أولي — سيارة دفع خلفي وحلبة اختبار. اضغط للبدء، ثم جرّب التسارع والانعطاف والهاندبريك.</p><button id="go">ابدأ القيادة</button></div></div>
<script>
(()=>{const c=document.getElementById('game'),ctx=c.getContext('2d'),$=id=>document.getElementById(id);let w,h,dpr,keys={},car,score=0,last=0,run=false,skids=[];
function resize(){dpr=Math.min(devicePixelRatio||1,2);w=c.clientWidth;h=c.clientHeight;c.width=w*dpr;c.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);if(!car)reset()}function reset(){car={x:w/2,y:h*.72,a:-Math.PI/2,v:0,side:0,spin:0};score=0;skids=[]}
function down(k,v){keys[k]=v;document.querySelectorAll('[data-k="'+k+'"]').forEach(b=>b.classList.toggle('on',v))}
document.querySelectorAll('[data-k]').forEach(b=>{let k=b.dataset.k;b.addEventListener('pointerdown',e=>{e.preventDefault();down(k,true)});['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,()=>down(k,false)))});
onkeydown=e=>{let m={ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right',ArrowUp:'gas',w:'gas',ArrowDown:'brake',s:'brake',' ':'hand',r:'reset'};if(m[e.key]){e.preventDefault();if(m[e.key]==='reset')reset();else down(m[e.key],true)}};onkeyup=e=>{let m={ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right',ArrowUp:'gas',w:'gas',ArrowDown:'brake',s:'brake',' ':'hand'};if(m[e.key])down(m[e.key],false)};
function track(){ctx.fillStyle='#263334';ctx.fillRect(0,0,w,h);ctx.fillStyle='#303b3c';ctx.beginPath();ctx.ellipse(w/2,h*.48,w*.43,h*.47,0,0,Math.PI*2);ctx.ellipse(w/2,h*.48,w*.25,h*.28,0,0,Math.PI*2,true);ctx.fill('evenodd');ctx.strokeStyle='#78817b';ctx.lineWidth=3;ctx.setLineDash([18,16]);ctx.beginPath();ctx.ellipse(w/2,h*.48,w*.34,h*.375,0,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);ctx.strokeStyle='#e4e1c4';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(w/2,h*.48,w*.43,h*.47,0,0,Math.PI*2);ctx.ellipse(w/2,h*.48,w*.25,h*.28,0,0,Math.PI*2);ctx.stroke();for(let i=0;i<10;i++){let x=(i*97+40)%w,y=(i*151+20)%h;ctx.fillStyle='#d7d2b7';ctx.fillRect(x,y,3,3)}}
function drawCar(){ctx.save();ctx.translate(car.x,car.y);ctx.rotate(car.a);ctx.fillStyle='#090d10';ctx.fillRect(-22,-14,9,7);ctx.fillRect(13,-14,9,7);ctx.fillRect(-22,8,9,7);ctx.fillRect(13,8,9,7);ctx.fillStyle='#ff7624';ctx.beginPath();ctx.roundRect(-25,-12,50,24,6);ctx.fill();ctx.fillStyle='#19242b';ctx.fillRect(-9,-9,17,18);ctx.fillStyle='#fff0d4';ctx.fillRect(18,-8,4,5);ctx.fillRect(18,3,4,5);ctx.restore()}
function frame(t){let dt=Math.min((t-last)/1000||0,.035);last=t;if(run){let throttle=keys.gas?1:0,brake=keys.brake?1:0,hand=keys.hand?1:0;car.v+=throttle*8*dt;car.v-=brake*14*dt;car.v*=Math.pow(.988,dt*60);car.v=Math.max(0,Math.min(car.v,48));let steer=(keys.left?-1:0)+(keys.right?1:0);let grip=hand?.45:1;let target=steer*car.v*.018;car.spin+=(target-car.spin)*Math.min(1,dt*5);car.a+=car.spin*grip*dt;car.side+=(steer*car.v*.15*hand-car.side)*dt*2.4;car.x+=Math.cos(car.a)*car.v*dt*12+car.side*dt*2;car.y+=Math.sin(car.a)*car.v*dt*12;if(car.x<25||car.x>w-25){car.x=Math.max(25,Math.min(w-25,car.x));car.v*=.72}if(car.y<25||car.y>h-25){car.y=Math.max(25,Math.min(h-25,car.y));car.v*=.72}let drift=Math.abs(car.spin*car.v*2);if(hand&&car.v>8&&steer)score+=Math.round(drift*dt*5);$('speed').textContent=Math.round(car.v*4.2);$('score').textContent=score;$('angle').textContent=Math.round(drift)+'°';if(hand&&car.v>10&&steer){skids.push({x:car.x,y:car.y,a:car.a});if(skids.length>180)skids.shift()}}
track();ctx.strokeStyle='#24201d';ctx.lineWidth=3;for(let s of skids){ctx.beginPath();ctx.arc(s.x,s.y,5,s.a,s.a+1.1);ctx.stroke()}drawCar();requestAnimationFrame(frame)}
$('go').onclick=()=>{$('start').style.display='none';run=true;reset()};addEventListener('resize',resize);resize();requestAnimationFrame(frame)})();
</script></body></html>
